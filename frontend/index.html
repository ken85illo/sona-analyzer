<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <link rel="stylesheet" href="style.css" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/seti.min.css"
        />
    </head>

    <body>
        <dialog id="parser-log">
            <div id="parser-log-container">
                <form method="dialog">
                    <div class="button-group" role="group">
                        <button type="button">All</button>
                        <button type="button">Productions</button>
                        <button type="button">Errors</button>
                    </div>
                    <button>Close</button>
                </form>
                <div id="syntax-container"></div>
            </div>
        </dialog>

        <header class="main-header">
            <img
                src="/assets/SONA_logo_1.png"
                alt="SONA Logo"
                class="sona-image"
            />
        </header>

        <div class="main-container">
            <div id="btn-container">
                <button onclick="handleSubmit()" id="analyze-bttn" class="bttn">
                    ANALYZE CODE
                </button>
                <button onclick="insertSample()" id="sample-bttn" class="bttn">
                    SAMPLE CODE
                </button>
            </div>

            <div class="text-editor-container">
                <label for="import-btn" class="kodchasan-bold bttn"
                    >Import</label
                >
                <input id="import-btn" type="file" accept=".sona" />
                <h2>Source Code</h2>
                <textarea
                    id="textarea-element"
                    placeholder="enter program"
                    wrap="off"
                ></textarea>
            </div>

            <div class="lexical-analysis-container">
                <div id="button-div">
                    <button onclick="switchView()" class="bttn">
                        Switch View
                    </button>
                    <input
                        type="number"
                        id="line-number"
                        min="1"
                        max="1"
                        value="1"
                        step="1"
                        class="bttn"
                    />
                    <div id="up-down">
                        <button
                            class="spinner-btn"
                            id="up"
                            onclick="spinnerIncrement()"
                        >
                            ▲
                        </button>
                        <button
                            class="spinner-btn"
                            id="down"
                            onclick="spinnerDecrement()"
                        >
                            ▼
                        </button>
                    </div>
                </div>

                <div class="lexical-analysis-table-container">
                    <div id="loading-indicator" style="display: none">
                        Loading lexical analysis...
                    </div>
                    <table id="lexical-elements-table">
                        <tr>
                            <th id="th-line-number">Line</th>
                            <th>"Token"</th>
                            <th>"Lexeme"</th>
                        </tr>
                    </table>
                </div>
            </div>
        </div>

        <br />
        <br />

        <div id="output"></div>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
        <script src="script.js"></script>
    </body>
</html>
