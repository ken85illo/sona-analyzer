<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <link rel="stylesheet" href="style.css"/>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/gruvbox-dark.min.css">
    </head>
    <body>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
        
        <button onclick="handleSubmit()" class="bttn">ANALYZE CODE</button>
        <div class="main-container">
            <textarea
                id="textarea-element"
                placeholder="enter program"
                wrap="off"
            ></textarea>
            <script>
            //used codemirror as the editor alias
            const editor = CodeMirror.fromTextArea(document.getElementById("textarea-element"), {
                lineNumbers: true,
                mode: "text/x-csrc",
                theme: "gruvbox-dark",     
                tabSize: 100,
                indentUnit: 4,
                indentWithTabs: true
            });
        </script>
            <div class="lexical-analysis-container">
                <button onclick="switchView()" class="bttn">Switch View</button>
                <input
                    type="number"
                    id="line-number"
                    min="1"
                    max="1"
                    value="1"
                    step="1"
                    class="bttn"
                />
                <p>Analysis</p>
                <table id="lexical-elements-table">
                    <tr>
                        <th>Line</th>
                        <th>"Token": "Lexeme"</th>
                    </tr>
                </table>
            </div>
        </div>

        <br />
        <br />

        <div id="output"></div>
        <script src="script.js"></script>
    </body>
</html>
