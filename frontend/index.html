<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <link rel="stylesheet" href="style.css" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/seti.min.css"
        />
    </head>

    <body>
        <dialog id="parser-log">
            <div id="parser-log-container">
                <form method="dialog" id="parser-log-header">
                    <div>
                        <input
                            type="radio"
                            id="syntax-all"
                            name="syntax-filter"
                            value="all"
                            checked
                        />
                        <label for="syntax-all" class="bttn">All</label>

                        <input
                            type="radio"
                            id="syntax-prods"
                            name="syntax-filter"
                            value="productions"
                        />
                        <label for="syntax-prods" class="bttn"
                            >Productions</label
                        >

                        <input
                            type="radio"
                            id="syntax-errors"
                            name="syntax-filter"
                            value="errors"
                        />
                        <label for="syntax-errors" class="bttn">Errors</label>
                    </div>
                    <button class="bttn">Close</button>
                </form>
                <div id="syntax-container"></div>
            </div>
        </dialog>

        <header class="main-header">
            <img
                src="/assets/SONA_logo_1.png"
                alt="SONA Logo"
                class="sona-image"
            />
        </header>

        <div class="main-container">
            <div id="btn-container">
                <button onclick="handleSubmit()" id="analyze-bttn" class="bttn">
                    ANALYZE CODE
                </button>
                <button onclick="insertSample()" id="sample-bttn" class="bttn">
                    SAMPLE CODE
                </button>
            </div>

            <div class="text-editor-container">
                <label for="import-btn" class="kodchasan-bold bttn"
                    >Import</label
                >
                <input id="import-btn" type="file" accept=".sona" />
                <h2>Source Code</h2>
                <textarea
                    id="textarea-element"
                    placeholder="enter program"
                    wrap="off"
                ></textarea>
            </div>

            <div class="lexical-analysis-container">
                <div id="button-div">
                    <button onclick="switchView()" class="bttn">
                        Switch View
                    </button>
                    <input
                        type="number"
                        id="line-number"
                        min="1"
                        max="1"
                        value="1"
                        step="1"
                        class="bttn"
                    />
                    <div id="up-down">
                        <button
                            class="spinner-btn"
                            id="up"
                            onclick="spinnerIncrement()"
                        >
                            ▲
                        </button>
                        <button
                            class="spinner-btn"
                            id="down"
                            onclick="spinnerDecrement()"
                        >
                            ▼
                        </button>
                    </div>
                </div>

                <div class="lexical-analysis-table-container">
                    <div id="loading-indicator" style="display: none">
                        Loading lexical analysis...
                    </div>
                    <table id="lexical-elements-table">
                        <tr>
                            <th id="th-line-number">Line</th>
                            <th>"Token"</th>
                            <th>"Lexeme"</th>
                        </tr>
                    </table>
                </div>
                <button type="button" class="bttn" id="parse-console-btn">
                    PARSER CONSOLE
                </button>
            </div>
        </div>

        <br />
        <br />

        <div id="output"></div>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
        <script src="script.js"></script>
        <script type="module">
            import 'https://cdn.interactjs.io/v1.9.20/auto-start/index.js'
            import 'https://cdn.interactjs.io/v1.9.20/actions/drag/index.js'
            import 'https://cdn.interactjs.io/v1.9.20/actions/resize/index.js'
            import 'https://cdn.interactjs.io/v1.9.20/modifiers/index.js'
            import 'https://cdn.interactjs.io/v1.9.20/dev-tools/index.js'
            import interact from 'https://cdn.interactjs.io/v1.9.20/interactjs/index.js'

            interact('#parser-log')
                .draggable({
                    listeners: {
                        start(event) {
                            console.log(event.type, event.target)
                        },
                        move(event) {
                            let { x, y } = event.target.dataset

                            x = (parseFloat(x) || 0) + event.dx
                            y = (parseFloat(y) || 0) + event.dy

                            event.target.style.transform = `translate(${x}px, ${y}px)`
                            Object.assign(event.target.dataset, { x, y })
                        },
                    },
                })
                .resizable({
                    edges: { top: true, left: true, bottom: true, right: true },
                    listeners: {
                        move: function (event) {
                            let { x, y } = event.target.dataset

                            x = (parseFloat(x) || 0) + event.deltaRect.left
                            y = (parseFloat(y) || 0) + event.deltaRect.top

                            Object.assign(event.target.style, {
                                width: `${event.rect.width}px`,
                                height: `${event.rect.height}px`,
                                transform: `translate(${x}px, ${y}px)`,
                            })

                            Object.assign(event.target.dataset, { x, y })
                        },
                    },
                })
        </script>
    </body>
</html>
