<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <button onclick="handleSubmit()">ANALYZE CODE</button>
        <div class="main-container">
            <textarea
                id="textarea-element"
                placeholder="enter program"
                wrap="off"
            ></textarea>

            <div class="lexical-analysis-container">
                <input
                    type="number"
                    id="line-number"
                    min="1"
                    max="1"
                    value="1"
                    step="1"
                />
                <p>Analysis</p>
                <table id="lexical-elements-table">
                    <tr>
                        <th>Line</th>
                        <th>"Token": "Lexeme"</th>
                    </tr>
                </table>
            </div>
        </div>

        <br />
        <br />

        <div id="output"></div>
        <script src="script.js"></script>
    </body>
</html>
